name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app scripts
      - run: python scripts/api_contract_test.py
      - run: python scripts/golden_response_test.py
      - run: python scripts/golden_value_test.py
      - run: mkdir -p app/data/runtime
      - run: python ../scripts/portfolio_readiness_matrix.py --strict > app/data/runtime/portfolio_readiness_matrix.json
      - run: python ../scripts/preflight.py --skip-frontend --skip-smoke --skip-signing-smoke --skip-ui-smoke --skip-manual-backend-tests --output-json backend/app/data/runtime/preflight_ci.json
      - run: |
          python ../scripts/production_audit.py --template --skip-api --preflight-evidence backend/app/data/runtime/preflight_ci.json > app/data/runtime/production_audit_write_result.json
          python ../scripts/verify_production_audit_write_result.py --path app/data/runtime/production_audit_write_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-preflight-evidence
          path: backend/app/data/runtime/preflight_ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-portfolio-readiness-matrix
          path: backend/app/data/runtime/portfolio_readiness_matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-production-audit
          path: backend/app/data/runtime/production_audits/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-production-audit-write-result
          path: backend/app/data/runtime/production_audit_write_result.json
      - run: |
          export ARTIFACT_SIGNING_KEY=ci-artifact-signing-secret
          export ARTIFACT_SIGNING_KEY_ID=ci-hmac-key
          export SMOKE_REQUIRE_SIGNING=1
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("backend did not become ready for signed smoke")
          PY
          python scripts/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("backend did not become ready")
          PY
        working-directory: backend
      - name: Start frontend
        run: |
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 npm run dev -- --hostname 127.0.0.1 --port 3000 > ../frontend.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:3000", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("frontend did not become ready")
          PY
        working-directory: frontend
      - run: npm run smoke:ui
        working-directory: frontend
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== backend.log ==="
          cat backend.log || true
          echo "=== frontend.log ==="
          cat frontend.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/compose_preflight.py --static-only
      - name: Write compose CI env
        run: |
          cat > .env.compose-ci <<'EOF'
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_API_KEY=viewer-key-for-compose-ci-000000000001
          BACKEND_PORT=18000
          FRONTEND_PORT=13000
          APP_DATA_DIR=/app/app/data
          RAG_DATA_DIR=/app/app/data
          CORS_ORIGINS=http://127.0.0.1:13000
          STORAGE_BACKEND=postgres
          DATABASE_URL=postgresql://agentic_rag:compose-ci-postgres-password@postgres:5432/agentic_rag
          POSTGRES_DB=agentic_rag
          POSTGRES_USER=agentic_rag
          POSTGRES_PASSWORD=compose-ci-postgres-password
          API_KEYS=admin-compose-ci-key-0000000001,operator-compose-ci-key-00000001,viewer-compose-ci-key-0000000001
          API_KEY_ROLES={"admin-compose-ci-key-0000000001":"admin","operator-compose-ci-key-00000001":"operator","viewer-compose-ci-key-0000000001":"viewer"}
          RATE_LIMIT_PER_MINUTE=120
          ARTIFACT_SIGNING_KEY=compose-ci-artifact-signing-key-with-32-bytes
          ARTIFACT_SIGNING_KEY_ID=compose-ci-hmac-key
          ARTIFACT_RETENTION_DAYS=365
          ARTIFACT_RETENTION_KEEP_MIN=1000
          ARTIFACT_OBJECT_STORE_ENABLED=true
          ARTIFACT_OBJECT_STORE_ENDPOINT=https://s3.compose-ci.example.com
          ARTIFACT_OBJECT_STORE_BUCKET=agentic-rag-compose-ci
          ARTIFACT_OBJECT_STORE_PREFIX=agentic-rag/artifacts
          ARTIFACT_OBJECT_STORE_REGION=us-east-1
          ARTIFACT_OBJECT_STORE_ACCESS_KEY_ID=compose-ci-object-access-key
          ARTIFACT_OBJECT_STORE_SECRET_ACCESS_KEY=compose-ci-object-secret-key
          RAG_VECTOR_BACKEND=pgvector
          RAG_PGVECTOR_TABLE=rag_chunks
          RAG_EMBEDDING_BACKEND=openai
          RAG_EMBEDDING_MODEL=text-embedding-3-small
          RAG_EMBEDDING_DIMENSIONS=128
          OPENAI_API_KEY=compose-ci-openai-key
          OPENAI_EMBEDDING_BASE_URL=https://api.openai.com/v1
          OPENAI_EMBEDDING_PRICE_PER_1K_TOKENS=0.001
          OPENAI_EMBEDDING_BUDGET_USD=0.05
          RNA_FOLDING_BACKEND=rnafold
          RNAFOLD_EXECUTABLE=RNAfold
          RNAFOLD_TIMEOUT_SECONDS=10
          RNAFOLD_WINDOW_NT=180
          EOF
      - run: docker compose --env-file .env.compose-ci config
      - run: |
          docker compose --profile postgres --env-file .env.compose-ci -f docker-compose.yml -f docker-compose.production.yml config
      - run: docker compose --profile postgres --env-file .env.compose-ci build
